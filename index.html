<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deadlock — Patch Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0c0a;
    --panel: #13110e;
    --card-bg: #1c1812;
    --gold: #c9a55a;
    --gold-dim: #7a5f30;
    --amber: #e8be86;
    --text: #e8ddc8;
    --text-dim: #8a7d6a;
    --accent: #d36c16;
    --border: #2a2318;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Crimson Text', Georgia, serif;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  header {
    text-align: center;
    padding: 2.5rem 2rem 1.5rem;
    position: relative;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #1a1510 0%, transparent 100%);
    z-index: 1;
  }

  header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 50%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
  }

  .title-label {
    font-family: 'Cinzel', serif;
    font-size: 0.65rem;
    letter-spacing: 0.45em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 0.4rem;
  }

  h1 {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(1.6rem, 4vw, 2.8rem);
    color: var(--gold);
    text-shadow: 0 0 40px rgba(201,165,90,0.3), 0 2px 4px rgba(0,0,0,0.8);
    letter-spacing: 0.08em;
  }

  .subtitle {
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    color: var(--text-dim);
    letter-spacing: 0.3em;
    margin-top: 0.4rem;
  }

  /* TABS */
  .tab-bar {
    display: flex;
    justify-content: center;
    gap: 0;
    padding: 1.5rem 2rem 0;
    position: relative;
    z-index: 1;
    border-bottom: 1px solid var(--border);
  }

  .tab-btn {
    font-family: 'Cinzel', serif;
    font-size: 0.68rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-dim);
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 0.6rem 1.6rem 0.75rem;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
    position: relative;
    bottom: -1px;
  }

  .tab-btn:hover { color: var(--amber); }

  .tab-btn.active {
    color: var(--gold);
    border-bottom-color: var(--gold);
  }

  /* TAB PANELS */
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* HERO TAB */
  .search-wrap {
    display: flex;
    justify-content: center;
    padding: 1.2rem 2rem 0;
    position: relative;
    z-index: 1;
  }

  .search-box {
    position: relative;
    width: 100%;
    max-width: 360px;
  }

  .search-box input {
    width: 100%;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: 'Crimson Text', serif;
    font-size: 1rem;
    padding: 0.55rem 2.2rem 0.55rem 1rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-box input:focus { border-color: var(--gold-dim); }
  .search-box input::placeholder { color: var(--text-dim); }
  .search-icon {
    position: absolute; right: 0.7rem; top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim); font-size: 0.9rem; pointer-events: none;
  }

  .grid-section {
    padding: 1.5rem 2rem 2rem;
    position: relative;
    z-index: 1;
    border-bottom: 1px solid var(--border);
  }

  .grid-section::after {
    content: '';
    position: absolute;
    bottom: 0; left: 2rem; right: 2rem; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
  }

  .hero-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
    gap: 8px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .hero-card {
    position: relative;
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
    background: var(--card-bg);
    border: 1px solid var(--border);
    transition: transform 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
    aspect-ratio: 88 / 119;
  }

  .hero-card:hover {
    transform: translateY(-3px) scale(1.04);
    border-color: var(--gold-dim);
    box-shadow: 0 8px 24px rgba(0,0,0,0.5), 0 0 0 1px var(--gold-dim);
    z-index: 2;
  }

  .hero-card.active {
    border-color: var(--gold);
    box-shadow: 0 0 0 2px var(--gold), 0 8px 28px rgba(201,165,90,0.3);
    transform: translateY(-2px);
  }

  .hero-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
    display: block;
    filter: brightness(0.8);
    transition: filter 0.12s;
  }

  .hero-card:hover img,
  .hero-card.active img { filter: brightness(1); }

  .hero-card-label {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 14px 3px 4px;
    text-align: center;
    font-family: 'Cinzel', serif;
    font-size: clamp(0.42rem, 1vw, 0.58rem);
    font-weight: 600;
    letter-spacing: 0.03em;
    color: #ffefd7;
    text-shadow: 0 1px 4px rgba(0,0,0,1), 0 0 8px rgba(0,0,0,1);
    background: linear-gradient(transparent, rgba(0,0,0,0.8) 50%);
    line-height: 1.2;
  }

  .patch-badge {
    position: absolute;
    top: 4px; right: 4px;
    background: var(--accent);
    color: #fff;
    font-family: 'Cinzel', serif;
    font-size: 0.48rem;
    font-weight: 700;
    padding: 1px 4px;
    border-radius: 2px;
    letter-spacing: 0.05em;
    line-height: 1.5;
    box-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }

  .hero-card[hidden] { display: none; }

  .detail-section {
    padding: 2rem;
    position: relative;
    z-index: 1;
    min-height: 220px;
  }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 220px;
    text-align: center;
    opacity: 0.4;
  }

  .empty-state .big-icon { font-size: 3rem; margin-bottom: 1rem; }
  .empty-state p {
    font-family: 'Cinzel', serif;
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    line-height: 1.9;
  }

  .hero-panel { animation: fadeUp 0.22s ease; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .hero-detail-header {
    display: flex;
    align-items: flex-end;
    gap: 1.5rem;
    margin-bottom: 1.5rem;
    padding-bottom: 1.25rem;
    border-bottom: 1px solid var(--border);
    position: relative;
  }

  .hero-detail-header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0;
    width: 35%; height: 1px;
    background: linear-gradient(90deg, var(--gold-dim), transparent);
  }

  .detail-card-img {
    width: 72px;
    height: 97px;
    object-fit: cover;
    object-position: top;
    border-radius: 5px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6), 0 0 0 1px rgba(201,165,90,0.25);
    flex-shrink: 0;
  }

  .detail-name-block h2 {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(1.3rem, 3vw, 2rem);
    color: var(--gold);
    text-shadow: 0 0 30px rgba(201,165,90,0.2);
    line-height: 1.1;
  }

  .detail-count {
    font-family: 'Cinzel', serif;
    font-size: 0.68rem;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    margin-top: 0.35rem;
  }

  .detail-count span { color: var(--accent); }

  .section-divider {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin: 0 0 1rem;
  }

  .section-divider::before, .section-divider::after {
    content: ''; flex: 1; height: 1px; background: var(--border);
  }

  .section-divider span {
    font-family: 'Cinzel', serif;
    font-size: 0.58rem;
    letter-spacing: 0.3em;
    color: var(--text-dim);
    text-transform: uppercase;
    white-space: nowrap;
  }

  .changes-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.45rem;
    max-width: 900px;
  }

  .change-item {
    display: flex;
    gap: 0.9rem;
    align-items: baseline;
    padding: 0.55rem 0.9rem;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    transition: border-color 0.12s, background 0.12s;
    line-height: 1.55;
  }

  .change-item:hover {
    border-color: var(--gold-dim);
    background: #1e1a14;
  }

  .change-bullet { color: var(--gold-dim); flex-shrink: 0; font-size: 0.65rem; margin-top: 0.18rem; }
  .change-text { font-size: 1rem; color: var(--text); }

  .tier-tag {
    display: inline-block;
    font-family: 'Cinzel', serif;
    font-size: 0.58rem;
    letter-spacing: 0.08em;
    padding: 1px 5px;
    border-radius: 2px;
    background: rgba(211,108,22,0.18);
    border: 1px solid rgba(211,108,22,0.4);
    color: var(--accent);
    vertical-align: middle;
    margin: 0 1px;
  }

  .no-changes {
    padding: 2.5rem;
    text-align: center;
    color: var(--text-dim);
    font-family: 'Cinzel', serif;
    font-size: 0.72rem;
    letter-spacing: 0.2em;
  }


  /* ITEM GROUPS */
  .item-group {
    display: flex;
    gap: 1rem;
    align-items: flex-start;
    padding: 0.7rem 0.9rem;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    transition: border-color 0.12s, background 0.12s;
    margin-bottom: 0.45rem;
  }

  .item-group:hover {
    border-color: var(--gold-dim);
    background: #1e1a14;
  }

  .item-group-icon {
    width: 36px;
    height: 36px;
    object-fit: contain;
    flex-shrink: 0;
    border-radius: 3px;
    margin-top: 2px;
    image-rendering: crisp-edges;
  }

  .item-group-icon-placeholder {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    background: var(--border);
    border-radius: 3px;
    margin-top: 2px;
  }

  .item-group-body {
    flex: 1;
    min-width: 0;
  }

  .item-group-name {
    font-family: 'Cinzel', serif;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--amber);
    margin-bottom: 0.35rem;
  }

  .item-group-changes {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
  }

  .item-group-change {
    display: flex;
    gap: 0.65rem;
    align-items: baseline;
    font-size: 0.97rem;
    color: var(--text);
    line-height: 1.5;
  }

  .item-group-bullet {
    color: var(--gold-dim);
    flex-shrink: 0;
    font-size: 0.55rem;
    margin-top: 0.2rem;
  }

  /* GENERAL / ITEMS / STREET BRAWL TABS */
  .flat-tab-content {
    padding: 2rem;
    max-width: 900px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
    animation: fadeUp 0.2s ease;
  }

  .flat-section-title {
    font-family: 'Cinzel', serif;
    font-size: 0.58rem;
    letter-spacing: 0.35em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin: 2rem 0 0.75rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--border);
  }

  .flat-section-title:first-child { margin-top: 0; }
</style>
</head>
<body>

<header>
  <div class="title-label">Patch Notes</div>
  <h1>DEADLOCK</h1>
  <div class="subtitle">Balance Changes</div>
</header>

<nav class="tab-bar">
  <button class="tab-btn active" data-tab="heroes">Heroes</button>
  <button class="tab-btn" data-tab="general">General</button>
  <button class="tab-btn" data-tab="items">Items</button>
  <button class="tab-btn" data-tab="streetbrawl">Street Brawl</button>
</nav>

<!-- HEROES TAB -->
<div class="tab-panel active" id="tab-heroes">
  <div class="search-wrap">
    <div class="search-box">
      <input type="text" id="heroSearch" placeholder="Search heroes…" autocomplete="off">
      <span class="search-icon">⌕</span>
    </div>
  </div>
  <section class="grid-section">
    <div class="hero-grid" id="heroGrid"></div>
  </section>
  <section class="detail-section" id="detailSection">
    <div class="empty-state" id="emptyState">
      <div class="big-icon">⚔</div>
      <p>Select a hero above<br>to view their patch changes</p>
    </div>
    <div class="hero-panel" id="heroPanel" style="display:none"></div>
  </section>
</div>

<!-- GENERAL TAB -->
<div class="tab-panel" id="tab-general">
  <div class="flat-tab-content" id="generalContent"></div>
</div>

<!-- ITEMS TAB -->
<div class="tab-panel" id="tab-items">
  <div class="flat-tab-content" id="itemsContent"></div>
</div>

<!-- STREET BRAWL TAB -->
<div class="tab-panel" id="tab-streetbrawl">
  <div class="flat-tab-content" id="streetbrawlContent"></div>
</div>

<script>

// ── TAB SWITCHING ──
const tabBtns = document.querySelectorAll('.tab-btn');
const tabPanels = document.querySelectorAll('.tab-panel');

tabBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    tabBtns.forEach(b => b.classList.remove('active'));
    tabPanels.forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});


// ── GROUPED ITEM RENDERER ──
function renderItemNotes(containerId, notes) {
  const el = document.getElementById(containerId);

  // Group consecutive lines by item name (prefix before colon)
  const groups = [];
  for (const note of notes) {
    const colonIdx = note.indexOf(':');
    if (colonIdx > 0) {
      const itemName = note.substring(0, colonIdx).trim();
      const change = note.substring(colonIdx + 1).trim();
      // Check if same item as last group
      if (groups.length > 0 && groups[groups.length - 1].name === itemName) {
        groups[groups.length - 1].changes.push(change);
      } else {
        groups.push({ name: itemName, changes: [change] });
      }
    } else {
      // No colon — treat as standalone (e.g. "Added a new T1 item, Grit...")
      // Try to extract item name from "Added ... ItemName."
      const addedMatch = note.match(/^Added a new [^,]+,\s*([\w\s'-]+?)\./);
      const itemName = addedMatch ? addedMatch[1].trim() : null;
      if (itemName && groups.length > 0 && groups[groups.length - 1].name === itemName) {
        groups[groups.length - 1].changes.push(note);
      } else {
        groups.push({ name: itemName || '—', changes: [note], noPrefix: true });
      }
    }
  }

  for (const group of groups) {
    const imgUrl = ITEM_IMAGES[group.name];

    const div = document.createElement('div');
    div.className = 'item-group';

    const iconHTML = imgUrl
      ? `<img class="item-group-icon" src="${imgUrl}" alt="${group.name}" loading="lazy" onerror="this.style.opacity=0.2">`
      : `<div class="item-group-icon-placeholder"></div>`;

    const changesHTML = group.changes.map(c =>
      `<li class="item-group-change"><span class="item-group-bullet">◆</span><span>${c}</span></li>`
    ).join('');

    div.innerHTML = `
      ${iconHTML}
      <div class="item-group-body">
        <div class="item-group-name">${group.name === '—' ? '' : group.name}</div>
        <ul class="item-group-changes">${changesHTML}</ul>
      </div>
    `;
    el.appendChild(div);
  }
}

// ── FLAT LIST RENDERER ──
function renderFlatNotes(containerId, notes) {
  const el = document.getElementById(containerId);
  const list = document.createElement('ul');
  list.className = 'changes-list';
  notes.forEach(note => {
    const li = document.createElement('li');
    li.className = 'change-item';
    li.innerHTML = `<span class="change-bullet">◆</span><span class="change-text">${note}</span>`;
    list.appendChild(li);
  });
  el.appendChild(list);
}

renderFlatNotes('generalContent', GENERAL_NOTES);
renderItemNotes('itemsContent', ITEMS_NOTES);
renderFlatNotes('streetbrawlContent', STREETBRAWL_NOTES);

// ── HERO GRID ──
const grid = document.getElementById('heroGrid');
const heroPanel = document.getElementById('heroPanel');
const emptyState = document.getElementById('emptyState');
const detailSection = document.getElementById('detailSection');
const searchInput = document.getElementById('heroSearch');

let cards = [];

HEROES.forEach(hero => {
  const notes = PATCH_NOTES[hero.name] || [];

  const card = document.createElement('div');
  card.className = 'hero-card';
  card.dataset.name = hero.name.toLowerCase();
  card.innerHTML = `
    <img src="${hero.url}" alt="${hero.name}" loading="lazy" onerror="this.style.opacity=0.25">
    ${notes.length > 0 ? `<div class="patch-badge">${notes.length}</div>` : ''}
    <div class="hero-card-label">${hero.name}</div>
  `;
  card.addEventListener('click', () => selectHero(hero, card));
  grid.appendChild(card);
  cards.push({ card, hero });
});

function selectHero(hero, cardEl) {
  cards.forEach(({ card }) => card.classList.remove('active'));
  cardEl.classList.add('active');

  const notes = PATCH_NOTES[hero.name] || [];

  emptyState.style.display = 'none';
  heroPanel.style.display = 'block';

  const changesHTML = notes.length === 0
    ? `<div class="no-changes">No balance changes recorded for this hero in this patch.</div>`
    : `<ul class="changes-list">${notes.map(note => {
        const text = note.replace(/\b(T1|T2|T3)\b/g, '<span class="tier-tag">$1</span>');
        return `<li class="change-item"><span class="change-bullet">◆</span><span class="change-text">${text}</span></li>`;
      }).join('')}</ul>`;

  heroPanel.innerHTML = `
    <div class="hero-detail-header">
      <img class="detail-card-img" src="${hero.url}" alt="${hero.name}">
      <div class="detail-name-block">
        <h2>${hero.name}</h2>
        <div class="detail-count"><span>${notes.length}</span> balance change${notes.length !== 1 ? 's' : ''} this patch</div>
      </div>
    </div>
    <div class="section-divider"><span>Changes</span></div>
    ${changesHTML}
  `;

  detailSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

searchInput.addEventListener('input', e => {
  const q = e.target.value.trim();
  cards.forEach(({ card }) => {
    if (!q) { card.hidden = false; return; }
    const regex = new RegExp('\\b' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i');
    card.hidden = !regex.test(card.dataset.name);
  });
});
