<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deadlock — Patch Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0c0a;
    --panel: #13110e;
    --card-bg: #1c1812;
    --gold: #c9a55a;
    --gold-dim: #7a5f30;
    --amber: #e8be86;
    --text: #e8ddc8;
    --text-dim: #8a7d6a;
    --accent: #d36c16;
    --border: #2a2318;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Crimson Text', Georgia, serif;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  header {
    text-align: center;
    padding: 2.5rem 2rem 1.5rem;
    position: relative;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #1a1510 0%, transparent 100%);
    z-index: 1;
  }

  header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 50%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
  }

  .title-label {
    font-family: 'Cinzel', serif;
    font-size: 0.65rem;
    letter-spacing: 0.45em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 0.4rem;
  }

  h1 {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(1.6rem, 4vw, 2.8rem);
    color: var(--gold);
    text-shadow: 0 0 40px rgba(201,165,90,0.3), 0 2px 4px rgba(0,0,0,0.8);
    letter-spacing: 0.08em;
  }

  .subtitle {
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    color: var(--text-dim);
    letter-spacing: 0.3em;
    margin-top: 0.4rem;
  }

  .search-wrap {
    display: flex;
    justify-content: center;
    padding: 1.2rem 2rem 0;
    position: relative;
    z-index: 1;
  }

  .search-box {
    position: relative;
    width: 100%;
    max-width: 360px;
  }

  .search-box input {
    width: 100%;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: 'Crimson Text', serif;
    font-size: 1rem;
    padding: 0.55rem 2.2rem 0.55rem 1rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-box input:focus { border-color: var(--gold-dim); }
  .search-box input::placeholder { color: var(--text-dim); }
  .search-icon {
    position: absolute; right: 0.7rem; top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim); font-size: 0.9rem; pointer-events: none;
  }

  /* GRID */
  .grid-section {
    padding: 1.5rem 2rem 2rem;
    position: relative;
    z-index: 1;
    border-bottom: 1px solid var(--border);
  }

  .grid-section::after {
    content: '';
    position: absolute;
    bottom: 0; left: 2rem; right: 2rem; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
  }

  .hero-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
    gap: 8px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .hero-card {
    position: relative;
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
    background: var(--card-bg);
    border: 1px solid var(--border);
    transition: transform 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
    aspect-ratio: 88 / 119;
  }

  .hero-card:hover {
    transform: translateY(-3px) scale(1.04);
    border-color: var(--gold-dim);
    box-shadow: 0 8px 24px rgba(0,0,0,0.5), 0 0 0 1px var(--gold-dim);
    z-index: 2;
  }

  .hero-card.active {
    border-color: var(--gold);
    box-shadow: 0 0 0 2px var(--gold), 0 8px 28px rgba(201,165,90,0.3);
    transform: translateY(-2px);
  }

  .hero-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
    display: block;
    filter: brightness(0.8);
    transition: filter 0.12s;
  }

  .hero-card:hover img,
  .hero-card.active img { filter: brightness(1); }

  .hero-card-label {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 14px 3px 4px;
    text-align: center;
    font-family: 'Cinzel', serif;
    font-size: clamp(0.42rem, 1vw, 0.58rem);
    font-weight: 600;
    letter-spacing: 0.03em;
    color: #ffefd7;
    text-shadow: 0 1px 4px rgba(0,0,0,1), 0 0 8px rgba(0,0,0,1);
    background: linear-gradient(transparent, rgba(0,0,0,0.8) 50%);
    line-height: 1.2;
  }

  .patch-badge {
    position: absolute;
    top: 4px; right: 4px;
    background: var(--accent);
    color: #fff;
    font-family: 'Cinzel', serif;
    font-size: 0.48rem;
    font-weight: 700;
    padding: 1px 4px;
    border-radius: 2px;
    letter-spacing: 0.05em;
    line-height: 1.5;
    box-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }

  .hero-card[hidden] { display: none; }

  /* DETAIL */
  .detail-section {
    padding: 2rem;
    position: relative;
    z-index: 1;
    min-height: 220px;
  }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 220px;
    text-align: center;
    opacity: 0.4;
  }

  .empty-state .big-icon { font-size: 3rem; margin-bottom: 1rem; }
  .empty-state p {
    font-family: 'Cinzel', serif;
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    line-height: 1.9;
  }

  .hero-panel { animation: fadeUp 0.22s ease; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .hero-detail-header {
    display: flex;
    align-items: flex-end;
    gap: 1.5rem;
    margin-bottom: 1.5rem;
    padding-bottom: 1.25rem;
    border-bottom: 1px solid var(--border);
    position: relative;
  }

  .hero-detail-header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0;
    width: 35%; height: 1px;
    background: linear-gradient(90deg, var(--gold-dim), transparent);
  }

  .detail-card-img {
    width: 72px;
    height: 97px;
    object-fit: cover;
    object-position: top;
    border-radius: 5px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6), 0 0 0 1px rgba(201,165,90,0.25);
    flex-shrink: 0;
  }

  .detail-name-block h2 {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(1.3rem, 3vw, 2rem);
    color: var(--gold);
    text-shadow: 0 0 30px rgba(201,165,90,0.2);
    line-height: 1.1;
  }

  .detail-count {
    font-family: 'Cinzel', serif;
    font-size: 0.68rem;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    margin-top: 0.35rem;
  }

  .detail-count span { color: var(--accent); }

  .section-divider {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin: 0 0 1rem;
  }

  .section-divider::before, .section-divider::after {
    content: ''; flex: 1; height: 1px; background: var(--border);
  }

  .section-divider span {
    font-family: 'Cinzel', serif;
    font-size: 0.58rem;
    letter-spacing: 0.3em;
    color: var(--text-dim);
    text-transform: uppercase;
    white-space: nowrap;
  }

  .changes-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.45rem;
    max-width: 900px;
  }

  .change-item {
    display: flex;
    gap: 0.9rem;
    align-items: baseline;
    padding: 0.55rem 0.9rem;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    transition: border-color 0.12s, background 0.12s;
    line-height: 1.55;
  }

  .change-item:hover {
    border-color: var(--gold-dim);
    background: #1e1a14;
  }

  .change-bullet { color: var(--gold-dim); flex-shrink: 0; font-size: 0.65rem; margin-top: 0.18rem; }
  .change-text { font-size: 1rem; color: var(--text); }

  .tier-tag {
    display: inline-block;
    font-family: 'Cinzel', serif;
    font-size: 0.58rem;
    letter-spacing: 0.08em;
    padding: 1px 5px;
    border-radius: 2px;
    background: rgba(211,108,22,0.18);
    border: 1px solid rgba(211,108,22,0.4);
    color: var(--accent);
    vertical-align: middle;
    margin: 0 1px;
  }

  .no-changes {
    padding: 2.5rem;
    text-align: center;
    color: var(--text-dim);
    font-family: 'Cinzel', serif;
    font-size: 0.72rem;
    letter-spacing: 0.2em;
  }
</style>
</head>
<body>

<header>
  <div class="title-label">Patch Notes</div>
  <h1>DEADLOCK</h1>
  <div class="subtitle">Hero Balance Changes</div>
</header>

<div class="search-wrap">
  <div class="search-box">
    <input type="text" id="heroSearch" placeholder="Search heroes…" autocomplete="off">
    <span class="search-icon">⌕</span>
  </div>
</div>

<section class="grid-section">
  <div class="hero-grid" id="heroGrid"></div>
</section>

<section class="detail-section" id="detailSection">
  <div class="empty-state" id="emptyState">
    <div class="big-icon">⚔</div>
    <p>Select a hero above<br>to view their patch changes</p>
  </div>
  <div class="hero-panel" id="heroPanel" style="display:none"></div>
</section>

<script>
const HEROES = [
  { name: "Abrams",       url: "https://deadlock.wiki/images/thumb/6/6d/Abrams_card.png/88px-Abrams_card.png" },
  { name: "Apollo",       url: "https://deadlock.wiki/images/thumb/0/0f/Apollo_card.png/88px-Apollo_card.png" },
  { name: "Bebop",        url: "https://deadlock.wiki/images/thumb/4/49/Bebop_card.png/88px-Bebop_card.png" },
  { name: "Billy",        url: "https://deadlock.wiki/images/thumb/e/e5/Billy_card.png/88px-Billy_card.png" },
  { name: "Calico",       url: "https://deadlock.wiki/images/thumb/e/e4/Calico_card.png/88px-Calico_card.png" },
  { name: "Celeste",      url: "https://deadlock.wiki/images/thumb/9/90/Celeste_card.png/88px-Celeste_card.png" },
  { name: "Doorman",      url: "https://deadlock.wiki/images/thumb/6/6f/The_Doorman_card.png/88px-The_Doorman_card.png" },
  { name: "Drifter",      url: "https://deadlock.wiki/images/thumb/4/4d/Drifter_card.png/88px-Drifter_card.png" },
  { name: "Dynamo",       url: "https://deadlock.wiki/images/thumb/7/70/Dynamo_card.png/88px-Dynamo_card.png" },
  { name: "Graves",       url: "https://deadlock.wiki/images/thumb/3/35/Graves_card.png/88px-Graves_card.png" },
  { name: "Grey Talon",   url: "https://deadlock.wiki/images/thumb/5/5a/Grey_Talon_card.png/88px-Grey_Talon_card.png" },
  { name: "Haze",         url: "https://deadlock.wiki/images/thumb/1/1b/Haze_card.png/88px-Haze_card.png" },
  { name: "Holliday",     url: "https://deadlock.wiki/images/thumb/1/10/Holliday_card.png/88px-Holliday_card.png" },
  { name: "Infernus",     url: "https://deadlock.wiki/images/thumb/6/6b/Infernus_card.png/88px-Infernus_card.png" },
  { name: "Ivy",          url: "https://deadlock.wiki/images/thumb/2/2c/Ivy_card.png/88px-Ivy_card.png" },
  { name: "Kelvin",       url: "https://deadlock.wiki/images/thumb/7/76/Kelvin_card.png/88px-Kelvin_card.png" },
  { name: "Lady Geist",   url: "https://deadlock.wiki/images/thumb/e/e8/Lady_Geist_card.png/88px-Lady_Geist_card.png" },
  { name: "Lash",         url: "https://deadlock.wiki/images/thumb/5/5a/Lash_card.png/88px-Lash_card.png" },
  { name: "McGinnis",     url: "https://deadlock.wiki/images/thumb/5/55/McGinnis_card.png/88px-McGinnis_card.png" },
  { name: "Mina",         url: "https://deadlock.wiki/images/thumb/a/a5/Mina_card.png/88px-Mina_card.png" },
  { name: "Mirage",       url: "https://deadlock.wiki/images/thumb/7/77/Mirage_card.png/88px-Mirage_card.png" },
  { name: "Mo & Krill",   url: "https://deadlock.wiki/images/thumb/a/a1/Mo_%26_Krill_card.png/88px-Mo_%26_Krill_card.png" },
  { name: "Paige",        url: "https://deadlock.wiki/images/thumb/b/b0/Paige_card.png/88px-Paige_card.png" },
  { name: "Paradox",      url: "https://deadlock.wiki/images/thumb/0/08/Paradox_card.png/88px-Paradox_card.png" },
  { name: "Pocket",       url: "https://deadlock.wiki/images/thumb/0/06/Pocket_card.png/88px-Pocket_card.png" },
  { name: "Rem",          url: "https://deadlock.wiki/images/thumb/2/2a/Rem_card.png/88px-Rem_card.png" },
  { name: "Seven",        url: "https://deadlock.wiki/images/thumb/c/cf/Seven_card.png/88px-Seven_card.png" },
  { name: "Shiv",         url: "https://deadlock.wiki/images/thumb/b/b8/Shiv_card.png/88px-Shiv_card.png" },
  { name: "Silver",       url: "https://deadlock.wiki/images/thumb/1/1e/Silver_card.png/88px-Silver_card.png" },
  { name: "Sinclair",     url: "https://deadlock.wiki/images/thumb/4/41/Sinclair_card.png/88px-Sinclair_card.png" },
  { name: "Venator",      url: "https://deadlock.wiki/images/thumb/6/6e/Venator_card.png/88px-Venator_card.png" },
  { name: "Victor",       url: "https://deadlock.wiki/images/thumb/3/3d/Victor_card.png/88px-Victor_card.png" },
  { name: "Vindicta",     url: "https://deadlock.wiki/images/thumb/6/69/Vindicta_card.png/88px-Vindicta_card.png" },
  { name: "Viscous",      url: "https://deadlock.wiki/images/thumb/5/53/Viscous_card.png/88px-Viscous_card.png" },
  { name: "Vyper",        url: "https://deadlock.wiki/images/thumb/b/bd/Vyper_card.png/88px-Vyper_card.png" },
  { name: "Warden",       url: "https://deadlock.wiki/images/thumb/1/10/Warden_card.png/88px-Warden_card.png" },
  { name: "Wraith",       url: "https://deadlock.wiki/images/thumb/8/85/Wraith_card.png/88px-Wraith_card.png" },
  { name: "Yamato",       url: "https://deadlock.wiki/images/thumb/2/2b/Yamato_card.png/88px-Yamato_card.png" },
];

const PATCH_NOTES = {
  "Abrams": ["Fixed speed coming out of canceling Shoulder Charge being too high when hitting a hero"],
  "Apollo": ["Disengaging Sigil base damage reduced from 100 to 85"],
  "Bebop": [],
  "Billy": ["Rising Ram T3 now also reduces cooldown by 10s"],
  "Calico": [],
  "Celeste": ["Bullet cycle time reduced from 0.65 to 0.58","Shining Wonder radius increased from 14m to 15.5m","Shining Wonder damage increased from 120 to 135"],
  "Doorman": ["Fixed a bug that could allow you to bring the Urn through a doorway"],
  "Drifter": ["Rend T3 now also increases melee scaling (1.2 to 1.6)","Bloodscent T3 increased from +10% Amplified Damage to +12%"],
  "Dynamo": ["Kinetic Pulse spirit scaling reduced from 1.8 to 1.65","Quantum Entanglement cooldown increased from 19s to 20s"],
  "Graves": [],
  "Grey Talon": [],
  "Haze": ["Restored being able to slide while using Bullet Dance","Bullet Dance range increased from 15m to 16m","Bullet Dance now has 30% evasion in the base ability","Bullet Dance T2 changed from \"+10% Fire Rate and -45s Cooldown\" to \"+10% Fire Rate and +3m Move Speed\"","Bullet Dance T3 changed from \"+60% Evasion and +4m Move Speed\" to \"+40% Evasion and -75s Cooldown\""],
  "Holliday": ["Fixed Rising Ram interrupting Lasso","Spirit Lasso T1 increased from +68 Damage to +80","Spirit Lasso T3 increased from -30s Cooldown to -50s"],
  "Infernus": ["Flame Dash DPS spirit scaling reduced from 1.0 to 0.7","Flame Dash DPS now does half damage to objective"],
  "Ivy": [],
  "Kelvin": [],
  "Lady Geist": [],
  "Lash": [],
  "McGinnis": ["Mini Turrets bounty from 80 + 2/minute to 40 + 4/minute","Fixed Mini Turrets being locked on objectives when they were invulnerable","Medicinal Specter duration increased from 6s to 6.5s"],
  "Mina": ["Nox Nostra DPS reduced by 6%"],
  "Mirage": ["Base health regen reduced from 2 to 1.5","Fire Scarabs duration reduced from 8s to 7s"],
  "Mo & Krill": ["Burrow move speed increased from +4 to +5"],
  "Paige": ["Stamina increased from 2 to 3","Dash speed reduced to slow bucket","Plot Armor cooldown reduced from 30s to 28s","Bookwyrm recharge timer reduced from 8s to 7s"],
  "Paradox": ["Kinetic Carbine cooldown reduced from 30s to 28s","Time Wall T2 weapon damage increased from +30% to +35%","Kinetic Carbine now provides +20% Air Dash Distance when charged"],
  "Pocket": ["Enchanter's Satchel spirit scaling increased from 0.9 to 1.1","Affliction cooldown reduced from 150s to 140s"],
  "Rem": ["Fixed a bug with Naptime that allowed you to attack while casting it","Pillow Toss recharge timer reduced from 10s to 9s"],
  "Seven": [],
  "Shiv": ["Alt fire knockback reduced by 10%","Serrated Knives spirit scaling reduced from 0.15 to 0.13","Serrated Knives T3 spirit scaling reduced from +0.1 to +0.09"],
  "Silver": ["Fixed Tail Whack applying -12% Bullet Resist for the Disarm duration","Slam Fire Current Health As Damage reduced from 4% to 3%"],
  "Sinclair": [],
  "Venator": ["Gutshot damage scaling reduced from 0.8 to 0.7","Gutshot wall hit damage scaling reduced from 0.9 to 0.8"],
  "Victor": ["Aura of Suffering T2 increased from +28 Max DPS to +34","Shocking Reanimation T3 increased from -100s Cooldown to -130s"],
  "Vindicta": [],
  "Viscous": ["Goo Ball lockout period from being affected again reduced from 1.35 to 1.2 (a previous bug with increased debuff resistance for subsequent CC not working correctly on this ability was fixed recently)","Fixed various locations where Splatter didn't bounce properly"],
  "Vyper": ["Lethal Venom cooldown increased from 24s to 28s","Lethal Venom T2 increased from -8s Cooldown to -12s","Lethal Venom cast range reduced from 15m to 10m and now scales with boons (0.2)","Fixed Armor Piercing Rounds doing damage through Petrify"],
  "Warden": [],
  "Wraith": [],
  "Yamato": [],
};

const grid = document.getElementById('heroGrid');
const heroPanel = document.getElementById('heroPanel');
const emptyState = document.getElementById('emptyState');
const detailSection = document.getElementById('detailSection');
const searchInput = document.getElementById('heroSearch');

let cards = [];

HEROES.forEach(hero => {
  const notes = PATCH_NOTES[hero.name] || [];

  const card = document.createElement('div');
  card.className = 'hero-card';
  card.dataset.name = hero.name.toLowerCase();
  card.innerHTML = `
    <img src="${hero.url}" alt="${hero.name}" loading="lazy" onerror="this.style.opacity=0.25">
    ${notes.length > 0 ? `<div class="patch-badge">${notes.length}</div>` : ''}
    <div class="hero-card-label">${hero.name}</div>
  `;
  card.addEventListener('click', () => selectHero(hero, card));
  grid.appendChild(card);
  cards.push({ card, hero });
});

function selectHero(hero, cardEl) {
  cards.forEach(({ card }) => card.classList.remove('active'));
  cardEl.classList.add('active');

  const notes = PATCH_NOTES[hero.name] || [];
  const cardSrc = hero.url;

  emptyState.style.display = 'none';
  heroPanel.style.display = 'block';

  const changesHTML = notes.length === 0
    ? `<div class="no-changes">No balance changes recorded for this hero in this patch.</div>`
    : `<ul class="changes-list">${notes.map(note => {
        const text = note.replace(/\b(T1|T2|T3)\b/g, '<span class="tier-tag">$1</span>');
        return `<li class="change-item"><span class="change-bullet">◆</span><span class="change-text">${text}</span></li>`;
      }).join('')}</ul>`;

  heroPanel.innerHTML = `
    <div class="hero-detail-header">
      <img class="detail-card-img" src="${cardSrc}" alt="${hero.name}">
      <div class="detail-name-block">
        <h2>${hero.name}</h2>
        <div class="detail-count"><span>${notes.length}</span> balance change${notes.length !== 1 ? 's' : ''} this patch</div>
      </div>
    </div>
    <div class="section-divider"><span>Changes</span></div>
    ${changesHTML}
  `;

  detailSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

searchInput.addEventListener('input', e => {
  const q = e.target.value.toLowerCase().trim();
  cards.forEach(({ card }) => {
    card.hidden = q !== '' && !card.dataset.name.includes(q);
  });
});
</script>
</body>
</html>
